# CI（09 第 10.2 節）。所有 action 以完整 commit SHA 釘版（版本註解在後）；permissions 只讀；checkout 不保留憑證。
# 工作：install、lint、typecheck、test、content、i18n、build（含建置後檢查與體積預算）、e2e（含 axe 與減少動態）、lighthouse、hygiene、licenses。
# E2E 與 Lighthouse 是平行的工作（2026-11-05 拆開），E2E 再分成幾個平行的工作（PR 兩個、main 四個）；最後由 e2e-lighthouse 把全部的結果收成一個檢查：
# main 的保護規則指定了那個檢查的名稱。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # pnpm 的 store 與快取都在 repo 內（.pnpm-store/、.cache/），CI 直接快取這兩個資料夾（09 第 2.5 節的查證結果）
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
  npm_config_cache: ${{ github.workspace }}/.cache/npm
  pnpm_config_state_dir: ${{ github.workspace }}/.cache/pnpm/state
  XDG_CONFIG_HOME: ${{ github.workspace }}/.cache/xdg-config
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify:
    name: lint、typecheck、test、content、i18n、hygiene、licenses
    runs-on: ubuntu-latest
    # 在 Playwright 的官方容器裡跑（2026-10-27）：WebKit 與三個瀏覽器的系統套件都內建，不再跑 apt（apt 卡住一天四次撞到工作的時間上限，
    # 紀錄只留下 The operation was canceled）；本機用同一個映像就能重現 CI 的 Linux 瀏覽器行為。映像以 digest 釘版，tag 的版本要和
    # @playwright/test 相同（check:actions 比對）；瀏覽器在映像的 /ms-playwright，這兩個工作用它取代 repo 內的快取路徑
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f # v1.64.1
    # 工作層級的 env 蓋掉 workflow 的：${{ github.workspace }} 在容器工作裡仍是執行器主機的路徑（/home/runner/…），容器裡不存在
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # Firefox 在容器裡要 $HOME 屬於目前使用者才肯啟動（Playwright 官方的 GitHub Actions 說明）；main 的 E2E 跑 Firefox
      HOME: /root
      npm_config_cache: /tmp/ll-npm-cache
      pnpm_config_state_dir: /tmp/ll-pnpm-state
      XDG_CONFIG_HOME: /tmp/ll-xdg-config
    # 執行器卡住時不等預設的 6 小時；數字約是正常耗時的三倍
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # 容器裡是 root、工作目錄屬於執行器的使用者，git 會拒絕（dubious ownership）；check:hygiene 與 content:build 都要跑 git
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: 還原 repo 內的 pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pnpm-store
            .cache/pnpm
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:exceptions
      - run: pnpm check:actions
      - run: pnpm check:deps
      - run: pnpm check:dom
      # 站規 4.1：全站的可點元素只准用設計系統元件；有違規或例外對不上就失敗（M3 整合時已清零）
      - run: pnpm check:links
      - run: pnpm check:tw
      - run: pnpm check:hygiene
      - run: pnpm check:core
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm tokens:check
      - run: pnpm schemas:check
      - run: pnpm content:check
      - run: pnpm content:lock --check
      - run: pnpm docs:examples
      - run: pnpm content:i18n-report
      - name: i18n：抽取後 catalog 不得有未 commit 的變動；complete 語系不得缺字
        run: pnpm i18n:check
      - run: pnpm licenses:check
      # web-ui 的元件測試在 Browser Mode（WebKit）：瀏覽器在容器裡，不用另外安裝
      - run: pnpm test
      - name: 覆蓋率（packages/core/src，門檻在 vitest.config.ts）
        run: pnpm test:coverage

  build:
    name: build、postbuild、budget
    runs-on: ubuntu-latest
    # 執行器卡住時不等預設的 6 小時（2026-10-24 apt 那一步曾卡 40 分鐘）；數字約是正常耗時的三倍
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pnpm-store
            .cache/pnpm
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:build
      - run: pnpm --filter @ledgerland/web build
      - run: pnpm budget
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    # 2026-11-05 起不含 Lighthouse（另一個工作平行跑）；「e2e、axe、reduced motion、lighthouse」這個名稱留給最下面的 e2e-lighthouse。
    # 同一天再分成幾個同時跑的工作，各自一台執行器：chromium-1、chromium-2（桌面 Chromium 加減少動態，用 Playwright 的 --shard 切成兩半）、
    # firefox、webkit。切法依實測（main 460e838 那次，2 個 worker）：四種設定依序跑 29.3 分鐘，其中桌面 Chromium 約 17.5 分鐘、
    # WebKit 約 7.6、Firefox 約 3.0、減少動態約 0.5（很多案例在 Firefox 與 WebKit 是略過的），只依瀏覽器分會卡在 Chromium，所以它再切兩半。
    # 整個 ci 的時間變成最慢的那一個工作；哪一種瀏覽器壞了也一眼看得出來。
    # PR 仍然只跑 Chromium（2026-10-23：縮短 PR 的等待時間），矩陣在 PR 只有 chromium 的兩項
    name: e2e、axe、reduced motion（${{ matrix.shard }}）
    runs-on: ubuntu-latest
    strategy:
      # 一個工作失敗不取消其他的：要看得到是只有一種瀏覽器壞還是都壞
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '["chromium-1","chromium-2"]' || '["chromium-1","chromium-2","firefox","webkit"]') }}
    # 在 Playwright 的官方容器裡跑（2026-10-27）：WebKit 與三個瀏覽器的系統套件都內建，不再跑 apt（apt 卡住一天四次撞到工作的時間上限，
    # 紀錄只留下 The operation was canceled）；本機用同一個映像就能重現 CI 的 Linux 瀏覽器行為。映像以 digest 釘版，tag 的版本要和
    # @playwright/test 相同（check:actions 比對）；瀏覽器在映像的 /ms-playwright，這兩個工作用它取代 repo 內的快取路徑
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f # v1.64.1
    # 工作層級的 env 蓋掉 workflow 的：${{ github.workspace }} 在容器工作裡仍是執行器主機的路徑（/home/runner/…），容器裡不存在
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # Firefox 在容器裡要 $HOME 屬於目前使用者才肯啟動（Playwright 官方的 GitHub Actions 說明）；main 的 E2E 跑 Firefox
      HOME: /root
      npm_config_cache: /tmp/ll-npm-cache
      pnpm_config_state_dir: /tmp/ll-pnpm-state
      XDG_CONFIG_HOME: /tmp/ll-xdg-config
    # 執行器卡住時不等預設的 6 小時。每個工作預期十分鐘上下（含安裝）；firefox 與 webkit 只在 main 跑，
    # 所以它們變慢在 PR 看不出來，加 E2E 案例之後要看 main 上四個工作各跑多久。
    # 經過（2026-11-05）：原本一個工作依序跑三種瀏覽器的 E2E、INP 與 Lighthouse 5 次，6a87afe 那次 39.6 分鐘、時限 40；期中考苦練多了幾個 E2E 案例後，
    # 28aa751、8e1860a 兩次測試全過卻在 Lighthouse 階段被取消，deploy 被略過。先把時限放寬到 60，再把 Lighthouse 拆成平行的工作（整個 ci 約 31 分鐘），
    # 最後分成幾個同時跑的工作
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pnpm-store
            .cache/pnpm
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      # 每個工作跑自己的 Playwright 專案（playwright.config.ts）：chromium 是 desktop-chromium 加 reduced-motion（它用 Chromium、只有一支 spec），
      # 兩個工作各跑一半（--shard，Playwright 依案例平均分）；firefox 是 desktop-firefox，webkit 是 iphone-webkit。三個瀏覽器都在容器裡，不用安裝
      - name: E2E（對 apps/web 的 wrangler dev，重現 Workers 的 SPA fallback 與 _headers；INP 另外跑）
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SHARD" in
            chromium-1) set -- --project desktop-chromium --project reduced-motion --shard 1/2 ;;
            chromium-2) set -- --project desktop-chromium --project reduced-motion --shard 2/2 ;;
            firefox) set -- --project desktop-firefox ;;
            webkit) set -- --project iphone-webkit ;;
            *) echo "不認得的工作：$SHARD"; exit 1 ;;
          esac
          pnpm e2e --grep-invert "INP：" "$@"
      - name: INP（單獨一個 worker，不和其他測試搶 CPU；門檻依執行器基準校正，見 inp.spec.ts）
        if: matrix.shard == 'chromium-1'
        run: pnpm e2e apps/web/e2e/inp.spec.ts --project desktop-chromium --workers 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          # 每個工作各傳一份（artifact 的名稱不能重複）
          name: e2e-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  lighthouse:
    # 2026-11-05 從 e2e 工作拆出來：和 E2E 平行跑，main 的 ci 從「E2E 加 Lighthouse」的約 42 分鐘降到兩者較慢的那一個（E2E，約 31 分鐘）。
    # 自己一台執行器，不接在 E2E 後面，量測也不受前面測試留下的負載影響；tools/perf.mjs 自己起 wrangler dev，門檻依 benchmarkIndex 校正
    name: lighthouse
    runs-on: ubuntu-latest
    # 和 e2e 用同一個容器：Lighthouse 用的 Chromium 就是映像裡 Playwright 的那一份
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f # v1.64.1
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      HOME: /root
      npm_config_cache: /tmp/ll-npm-cache
      pnpm_config_state_dir: /tmp/ll-pnpm-state
      XDG_CONFIG_HOME: /tmp/ll-xdg-config
    # main 跑 5 次約 10 分鐘、PR 跑 3 次約 6 分鐘，加上安裝約 1 分鐘；數字約是正常耗時的三倍
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pnpm-store
            .cache/pnpm
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - name: Lighthouse（main 5 次、PR 3 次取中位數；統計腳本指向 stub）
        run: pnpm perf --runs ${{ github.event_name == 'pull_request' && 3 || 5 }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-report
          path: .local-reports/perf
          retention-days: 7

  e2e-lighthouse:
    # main 的保護規則要求一個叫「e2e、axe、reduced motion、lighthouse」的檢查通過。拆開之後由這個工作沿用那個名稱，
    # e2e（矩陣裡每一個工作都成功，needs.e2e.result 才是 success）與 lighthouse 都成功它才成功，所以不必改 repo 的規則，
    # 名稱也還是照字面的意思。if: always() 讓前面失敗或被略過時它照樣跑、照樣判失敗，不會因為「被略過」而讓必要的檢查懸著
    name: e2e、axe、reduced motion、lighthouse
    runs-on: ubuntu-latest
    needs: [e2e, lighthouse]
    if: always()
    timeout-minutes: 5
    steps:
      - name: E2E 與 Lighthouse 都要成功
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
        run: |
          echo "e2e：${E2E_RESULT}；lighthouse：${LIGHTHOUSE_RESULT}"
          [ "${E2E_RESULT}" = "success" ] && [ "${LIGHTHOUSE_RESULT}" = "success" ]

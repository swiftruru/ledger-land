# CI（09 第 10.2 節）。所有 action 以完整 commit SHA 釘版（版本註解在後）；permissions 只讀；checkout 不保留憑證。
# 工作：install、lint、typecheck、test、content、i18n、build（含建置後檢查與體積預算）、e2e（含 axe 與減少動態）、lighthouse、hygiene、licenses。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # pnpm 的 store 與快取都在 repo 內（.pnpm-store/、.cache/），CI 直接快取這兩個資料夾（09 第 2.5 節的查證結果）
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
  npm_config_cache: ${{ github.workspace }}/.cache/npm
  pnpm_config_state_dir: ${{ github.workspace }}/.cache/pnpm/state
  XDG_CONFIG_HOME: ${{ github.workspace }}/.cache/xdg-config
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify:
    name: lint、typecheck、test、content、i18n、hygiene、licenses
    runs-on: ubuntu-latest
    # 在 Playwright 的官方容器裡跑（2026-10-27）：WebKit 與三個瀏覽器的系統套件都內建，不再跑 apt（apt 卡住一天四次撞到工作的時間上限，
    # 紀錄只留下 The operation was canceled）；本機用同一個映像就能重現 CI 的 Linux 瀏覽器行為。映像以 digest 釘版，tag 的版本要和
    # @playwright/test 相同（check:actions 比對）；瀏覽器在映像的 /ms-playwright，這兩個工作用它取代 repo 內的快取路徑
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f # v1.64.0
    # 工作層級的 env 蓋掉 workflow 的：${{ github.workspace }} 在容器工作裡仍是執行器主機的路徑（/home/runner/…），容器裡不存在
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # Firefox 在容器裡要 $HOME 屬於目前使用者才肯啟動（Playwright 官方的 GitHub Actions 說明）；main 的 E2E 跑 Firefox
      HOME: /root
      npm_config_cache: /tmp/ll-npm-cache
      pnpm_config_state_dir: /tmp/ll-pnpm-state
      XDG_CONFIG_HOME: /tmp/ll-xdg-config
    # 執行器卡住時不等預設的 6 小時；數字約是正常耗時的三倍
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # 容器裡是 root、工作目錄屬於執行器的使用者，git 會拒絕（dubious ownership）；check:hygiene 與 content:build 都要跑 git
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: 還原 repo 內的 pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pnpm-store
            .cache/pnpm
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:exceptions
      - run: pnpm check:actions
      - run: pnpm check:deps
      - run: pnpm check:dom
      # 站規 4.1：全站的可點元素只准用設計系統元件；有違規或例外對不上就失敗（M3 整合時已清零）
      - run: pnpm check:links
      - run: pnpm check:tw
      - run: pnpm check:hygiene
      - run: pnpm check:core
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm tokens:check
      - run: pnpm schemas:check
      - run: pnpm content:check
      - run: pnpm content:lock --check
      - run: pnpm docs:examples
      - run: pnpm content:i18n-report
      - name: i18n：抽取後 catalog 不得有未 commit 的變動；complete 語系不得缺字
        run: pnpm i18n:check
      - run: pnpm licenses:check
      # web-ui 的元件測試在 Browser Mode（WebKit）：瀏覽器在容器裡，不用另外安裝
      - run: pnpm test
      - name: 覆蓋率（packages/core/src，門檻在 vitest.config.ts）
        run: pnpm test:coverage

  build:
    name: build、postbuild、budget
    runs-on: ubuntu-latest
    # 執行器卡住時不等預設的 6 小時（2026-10-24 apt 那一步曾卡 40 分鐘）；數字約是正常耗時的三倍
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pnpm-store
            .cache/pnpm
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:build
      - run: pnpm --filter @ledgerland/web build
      - run: pnpm budget
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: e2e、axe、reduced motion、lighthouse
    runs-on: ubuntu-latest
    # 在 Playwright 的官方容器裡跑（2026-10-27）：WebKit 與三個瀏覽器的系統套件都內建，不再跑 apt（apt 卡住一天四次撞到工作的時間上限，
    # 紀錄只留下 The operation was canceled）；本機用同一個映像就能重現 CI 的 Linux 瀏覽器行為。映像以 digest 釘版，tag 的版本要和
    # @playwright/test 相同（check:actions 比對）；瀏覽器在映像的 /ms-playwright，這兩個工作用它取代 repo 內的快取路徑
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f # v1.64.0
    # 工作層級的 env 蓋掉 workflow 的：${{ github.workspace }} 在容器工作裡仍是執行器主機的路徑（/home/runner/…），容器裡不存在
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # Firefox 在容器裡要 $HOME 屬於目前使用者才肯啟動（Playwright 官方的 GitHub Actions 說明）；main 的 E2E 跑 Firefox
      HOME: /root
      npm_config_cache: /tmp/ll-npm-cache
      pnpm_config_state_dir: /tmp/ll-pnpm-state
      XDG_CONFIG_HOME: /tmp/ll-xdg-config
    # 執行器卡住時不等預設的 6 小時；數字約是正常耗時的三倍
    timeout-minutes: 40
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pnpm-store
            .cache/pnpm
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      # PR 只跑 Chromium（desktop-chromium 與 reduced-motion）與 3 次 Lighthouse，push 到 main 才跑三個瀏覽器與 5 次（2026-10-23，縮短 PR 的等待時間）；
      # 三個瀏覽器都在容器裡，不用安裝
      - name: E2E（對 apps/web 的 wrangler dev，重現 Workers 的 SPA fallback 與 _headers；PR 只跑 Chromium 專案；INP 另外跑）
        run: pnpm e2e --grep-invert "INP：" ${{ github.event_name == 'pull_request' && '--project desktop-chromium --project reduced-motion' || '' }}
      - name: INP（單獨一個 worker，不和其他測試搶 CPU；門檻依執行器基準校正，見 inp.spec.ts）
        run: pnpm e2e apps/web/e2e/inp.spec.ts --project desktop-chromium --workers 1
      - name: Lighthouse（main 5 次、PR 3 次取中位數；統計腳本指向 stub）
        run: pnpm perf --runs ${{ github.event_name == 'pull_request' && 3 || 5 }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
            .local-reports/perf
          retention-days: 7

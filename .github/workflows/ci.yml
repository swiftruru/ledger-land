# CI（09 第 10.2 節）。所有 action 以完整 commit SHA 釘版（版本註解在後）；permissions 只讀；checkout 不保留憑證。
# 工作：install、lint、typecheck、test、content、i18n、build（含建置後檢查與體積預算）、e2e（含 axe 與減少動態）、lighthouse、hygiene、licenses。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # pnpm 的 store 與快取都在 repo 內（.pnpm-store/、.cache/），CI 直接快取這兩個資料夾（09 第 2.5 節的查證結果）
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
  npm_config_cache: ${{ github.workspace }}/.cache/npm
  pnpm_config_state_dir: ${{ github.workspace }}/.cache/pnpm/state
  XDG_CONFIG_HOME: ${{ github.workspace }}/.cache/xdg-config
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify:
    name: lint、typecheck、test、content、i18n、hygiene、licenses
    runs-on: ubuntu-latest
    # 執行器卡住時不等預設的 6 小時（2026-10-24 apt 那一步曾卡 40 分鐘）；數字約是正常耗時的三倍
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: 還原 repo 內的 pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pnpm-store
            .cache/pnpm
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:exceptions
      - run: pnpm check:actions
      - run: pnpm check:deps
      - run: pnpm check:dom
      # 站規 4.1：全站的可點元素只准用設計系統元件；有違規或例外對不上就失敗（M3 整合時已清零）
      - run: pnpm check:links
      - run: pnpm check:tw
      - run: pnpm check:hygiene
      - run: pnpm check:core
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm tokens:check
      - run: pnpm schemas:check
      - run: pnpm content:check
      - run: pnpm content:lock --check
      - run: pnpm docs:examples
      - run: pnpm content:i18n-report
      - name: i18n：抽取後 catalog 不得有未 commit 的變動；complete 語系不得缺字
        run: pnpm i18n:check
      - run: pnpm licenses:check
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # 系統相依套件（apt）和瀏覽器檔案分開裝：apt 偶爾卡住（2026-10-27 一天三次卡到工作的 20 分鐘上限才被切掉），每次最多 6 分鐘、試兩次；
      # 瀏覽器檔案在上面的快取裡，命中時幾秒就好
      - name: 安裝 WebKit 的系統相依套件（apt 卡住就重試）
        run: for i in 1 2; do timeout 6m pnpm exec playwright install-deps webkit && exit 0; echo "apt 第 $i 次沒有在 6 分鐘內完成，重試"; done; exit 1
      - name: 安裝 Playwright 的 WebKit（web-ui 的元件測試在 Browser Mode）
        run: pnpm exec playwright install webkit
      - run: pnpm test
      - name: 覆蓋率（packages/core/src，門檻在 vitest.config.ts）
        run: pnpm test:coverage

  build:
    name: build、postbuild、budget
    runs-on: ubuntu-latest
    # 執行器卡住時不等預設的 6 小時（2026-10-24 apt 那一步曾卡 40 分鐘）；數字約是正常耗時的三倍
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pnpm-store
            .cache/pnpm
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:build
      - run: pnpm --filter @ledgerland/web build
      - run: pnpm budget
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: e2e、axe、reduced motion、lighthouse
    runs-on: ubuntu-latest
    # 執行器卡住時不等預設的 6 小時（2026-10-24 apt 那一步曾卡 40 分鐘）；數字約是正常耗時的三倍
    timeout-minutes: 40
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pnpm-store
            .cache/pnpm
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # PR 只跑 Chromium（desktop-chromium 與 reduced-motion）與 3 次 Lighthouse，push 到 main 才跑三個瀏覽器與 5 次（2026-10-23，縮短 PR 的等待時間）
      # PR 只裝 Chromium 且不跑 --with-deps：執行器映像已含 Chrome 的系統相依套件，apt 那一步偶爾要十分鐘（2026-10-23 量到）；main 裝三個瀏覽器時才需要
      - name: 三個瀏覽器的系統相依套件（只在 main；apt 卡住就重試，每次最多 6 分鐘）
        if: github.event_name != 'pull_request'
        run: for i in 1 2; do timeout 6m pnpm exec playwright install-deps chromium webkit firefox && exit 0; echo "apt 第 $i 次沒有在 6 分鐘內完成，重試"; done; exit 1
      - name: 安裝 Playwright 瀏覽器（PR 只裝 Chromium）
        run: pnpm exec playwright install ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium webkit firefox' }}
      - name: E2E（對 apps/web 的 wrangler dev，重現 Workers 的 SPA fallback 與 _headers；PR 只跑 Chromium 專案；INP 另外跑）
        run: pnpm e2e --grep-invert "INP：" ${{ github.event_name == 'pull_request' && '--project desktop-chromium --project reduced-motion' || '' }}
      - name: INP（單獨一個 worker，不和其他測試搶 CPU；門檻依執行器基準校正，見 inp.spec.ts）
        run: pnpm e2e apps/web/e2e/inp.spec.ts --project desktop-chromium --workers 1
      - name: Lighthouse（main 5 次、PR 3 次取中位數；統計腳本指向 stub）
        run: pnpm perf --runs ${{ github.event_name == 'pull_request' && 3 || 5 }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
            .local-reports/perf
          retention-days: 7

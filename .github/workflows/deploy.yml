# 部署（09 第 10.1、7.4 節）：ci 在 main 上全部通過後，在 apps/web 目錄執行 wrangler deploy，整批部署到 Cloudflare Workers；
# concurrency 確保同時只有一個部署；部署後執行煙霧測試。只需要 repo secrets 的 CLOUDFLARE_API_TOKEN 與 CLOUDFLARE_ACCOUNT_ID。
# 自訂網域 ledgerland.swift.moe 由 apps/web/wrangler.jsonc 的 routes 綁定（第一次正式部署時由使用者決定）。
# 要不要部署看「上一次成功的 deploy 到這個 commit 之間」有沒有動到網站，不是只看最新一個 commit（2026-11-05）：
# 28aa751 與 8e1860a 的 ci 超時被取消、deploy 被略過，接著只改 ci.yml 的 5646d3f 通過了，只看 HEAD~1 就判定不用部署，兩個 commit 的網站改動沒有上線。
# workflow_dispatch 是手動部署 main 最新的 commit（不看變動範圍），給這種漏掉的情況與緊急重新部署用。
name: deploy

on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  # 查上一次成功的 deploy 是哪個 commit（gh run list）
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  npm_config_cache: ${{ github.workspace }}/.cache/npm
  pnpm_config_state_dir: ${{ github.workspace }}/.cache/pnpm/state
  XDG_CONFIG_HOME: ${{ github.workspace }}/.cache/xdg-config
  WRANGLER_SEND_METRICS: 'false'

jobs:
  deploy:
    # 手動部署只在 main 上；自動的要 ci 全部通過
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # 執行器卡住時不等預設的 6 小時（2026-10-24 apt 那一步曾卡 40 分鐘）；數字約是正常耗時的三倍
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # 要和上一次成功部署的 commit 比對，所以抓完整的歷史
          fetch-depth: 0
      - name: 只在 apps/web 或它的建置輸入有變動時部署（09 第 10.1 節）
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$MANUAL" = "true" ]; then
            echo "手動部署：不看變動範圍"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 基準是上一次成功的 deploy 所在的 commit（這一次還在跑，不會被列出來）。成功的 deploy 代表「到那個 commit 為止的網站改動都上線了」：
          # 有改動時是真的部署過，沒有改動時是相對它自己的基準不必部署。ci 被取消或失敗的 commit 不會有成功的 deploy，它們的改動就留到下一次一起算。
          base=$(gh run list --workflow deploy.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
          paths="apps/web packages content schemas tools pnpm-lock.yaml package.json pnpm-workspace.yaml"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "找不到上一次成功的 deploy（基準：${base:-無}），照常部署"
            deploy=true
          elif git merge-base --is-ancestor HEAD "$base"; then
            echo "這個 commit 不比上一次部署的 ${base} 新，不部署"
            deploy=false
          elif git diff --quiet "$base" HEAD -- $paths; then
            echo "${base} 之後沒有動到網站，不部署"
            deploy=false
          else
            echo "${base} 之後動到網站："
            git diff --stat "$base" HEAD -- $paths | tail -1
            deploy=true
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.changed.outputs.deploy == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changed.outputs.deploy == 'true'
        with:
          node-version-file: .node-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.changed.outputs.deploy == 'true'
        with:
          path: |
            .pnpm-store
            .cache/pnpm
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
        if: steps.changed.outputs.deploy == 'true'
      - run: pnpm content:build
        if: steps.changed.outputs.deploy == 'true'
      - name: 正式建置（拿掉 noindex；統計只在正式 origin 啟用）
        if: steps.changed.outputs.deploy == 'true'
        run: pnpm --filter @ledgerland/web build
        env:
          LL_DEPLOY_TARGET: production
      - run: pnpm budget
        if: steps.changed.outputs.deploy == 'true'
      - name: 部署（在 apps/web 目錄執行 wrangler）
        if: steps.changed.outputs.deploy == 'true'
        working-directory: apps/web
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 煙霧測試（09 第 7.4 節）：首頁、中文深層連結、/en/ 深層連結都回殼層 200 並帶 CSP；sitemap.xml 與 robots.txt 是原檔
        if: steps.changed.outputs.deploy == 'true'
        run: |
          base="${LL_PRODUCTION_ORIGIN}"
          for p in / /terms/tm_r4w8n2qe/ /en/terms/tm_r4w8n2qe/; do
            out=$(curl -sS -o /tmp/body -w '%{http_code} %{content_type}' -D /tmp/headers "$base$p")
            echo "$p -> $out"
            case "$out" in 200\ text/html*) ;; *) echo "狀態碼或內容類型不對"; exit 1 ;; esac
            grep -qi '^content-security-policy:' /tmp/headers || { echo "沒有 CSP 標頭"; exit 1; }
            grep -q 'id="ll-tabbar"' /tmp/body || { echo "回傳的不是殼層"; exit 1; }
          done
          # sitemap.xml 與 robots.txt 是原檔，不是殼層（05 第 9.3 節）
          out=$(curl -sS -o /tmp/sitemap -w '%{http_code}' "$base/sitemap.xml")
          echo "/sitemap.xml -> $out"
          [ "$out" = 200 ] && grep -q '<urlset' /tmp/sitemap && grep -q "$base/en/terms/" /tmp/sitemap || { echo "sitemap.xml 不對"; exit 1; }
          out=$(curl -sS -o /tmp/robots -w '%{http_code}' "$base/robots.txt")
          echo "/robots.txt -> $out"
          [ "$out" = 200 ] && grep -q "^Sitemap: $base/sitemap.xml" /tmp/robots || { echo "robots.txt 不對"; exit 1; }
        env:
          LL_PRODUCTION_ORIGIN: ${{ vars.LL_PRODUCTION_ORIGIN || 'https://ledgerland.swift.moe' }}

# 部署（09 第 10.1、7.4 節）：ci 在 main 上全部通過後，在 apps/web 目錄執行 wrangler deploy，整批部署到 Cloudflare Workers；
# concurrency 確保同時只有一個部署；部署後執行煙霧測試。只需要 repo secrets 的 CLOUDFLARE_API_TOKEN 與 CLOUDFLARE_ACCOUNT_ID。
# 自訂網域 ledgerland.swift.moe 由 apps/web/wrangler.jsonc 的 routes 綁定（第一次正式部署時由使用者決定）。
name: deploy

on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  npm_config_cache: ${{ github.workspace }}/.cache/npm
  pnpm_config_state_dir: ${{ github.workspace }}/.cache/pnpm/state
  XDG_CONFIG_HOME: ${{ github.workspace }}/.cache/xdg-config
  WRANGLER_SEND_METRICS: 'false'

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # 執行器卡住時不等預設的 6 小時（2026-10-24 apt 那一步曾卡 40 分鐘）；數字約是正常耗時的三倍
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: 只在 apps/web 或它的建置輸入有變動時部署（09 第 10.1 節）
        id: changed
        run: |
          if git diff --quiet HEAD~1 HEAD -- apps/web packages content schemas tools pnpm-lock.yaml package.json pnpm-workspace.yaml 2>/dev/null; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.changed.outputs.deploy == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changed.outputs.deploy == 'true'
        with:
          node-version-file: .node-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.changed.outputs.deploy == 'true'
        with:
          path: |
            .pnpm-store
            .cache/pnpm
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
        if: steps.changed.outputs.deploy == 'true'
      - run: pnpm content:build
        if: steps.changed.outputs.deploy == 'true'
      - name: 正式建置（拿掉 noindex；統計只在正式 origin 啟用）
        if: steps.changed.outputs.deploy == 'true'
        run: pnpm --filter @ledgerland/web build
        env:
          LL_DEPLOY_TARGET: production
      - run: pnpm budget
        if: steps.changed.outputs.deploy == 'true'
      - name: 部署（在 apps/web 目錄執行 wrangler）
        if: steps.changed.outputs.deploy == 'true'
        working-directory: apps/web
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 煙霧測試（09 第 7.4 節）：首頁、中文深層連結、/en/ 深層連結都回殼層 200 並帶 CSP
        if: steps.changed.outputs.deploy == 'true'
        run: |
          base="${LL_PRODUCTION_ORIGIN}"
          for p in / /terms/tm_r4w8n2qe/ /en/terms/tm_r4w8n2qe/; do
            out=$(curl -sS -o /tmp/body -w '%{http_code} %{content_type}' -D /tmp/headers "$base$p")
            echo "$p -> $out"
            case "$out" in 200\ text/html*) ;; *) echo "狀態碼或內容類型不對"; exit 1 ;; esac
            grep -qi '^content-security-policy:' /tmp/headers || { echo "沒有 CSP 標頭"; exit 1; }
            grep -q 'id="ll-tabbar"' /tmp/body || { echo "回傳的不是殼層"; exit 1; }
          done
        env:
          LL_PRODUCTION_ORIGIN: ${{ vars.LL_PRODUCTION_ORIGIN || 'https://ledgerland.swift.moe' }}
